
<div class="login-container">
  <div class="login-box">
    <h1>USER LOGIN</h1>

    <form>
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="Enter username"
      />

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter password"
      />

      <button type="submit">LOGIN</button>
    </form>
  </div>
</div>
